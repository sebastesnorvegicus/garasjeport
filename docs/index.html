<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f2933">
  <title>Garasjeport</title>
  <!-- Versjonsnummeret (?v=) tvinger nettleseren til å hente nye filer. Øk det ved hver endring i docs/. -->
  <link rel="stylesheet" href="style.css?v=2026-11-05">
</head>
<body>
  <main>
    <header>
      <h1>Garasjeport</h1>
      <button id="settings-btn" class="link" type="button">Innstillinger</button>
    </header>

    <section id="login" hidden>
      <h2>Tilgangstoken</h2>
      <p>Lim inn tilgangstokenet (APP_TOKEN). Det lagres bare i denne nettleseren.</p>
      <form id="login-form">
        <input id="token-input" type="password" autocomplete="current-password" placeholder="Tilgangstoken" required>
        <button type="submit" class="primary">Lagre</button>
      </form>
      <p id="login-error" class="error" hidden></p>
    </section>

    <section id="app" hidden>
      <div id="status-card" class="card status-unknown">
        <button id="live-dot" class="dot dot-bad" type="button" aria-label="Når kom siste melding?"></button>
        <svg class="garage" viewBox="0 0 160 100" aria-hidden="true">
          <defs>
            <clipPath id="opening"><rect x="20" y="50" width="120" height="46"/></clipPath>
          </defs>
          <polygon class="roof" points="2,40 158,40 148,14 12,14"/>
          <rect class="fascia" x="2" y="38" width="156" height="3"/>
          <rect class="wall" x="8" y="41" width="144" height="55"/>
          <g class="board">
            <line x1="14" y1="41" x2="14" y2="96"/>
            <line x1="146" y1="41" x2="146" y2="96"/>
          </g>
          <rect class="inside" x="20" y="50" width="120" height="46"/>
          <g clip-path="url(#opening)">
            <g class="door">
              <rect class="panel" x="20" y="50" width="120" height="46"/>
              <line class="joint" x1="20" y1="61.5" x2="140" y2="61.5"/>
              <line class="joint" x1="20" y1="73" x2="140" y2="73"/>
              <line class="joint" x1="20" y1="84.5" x2="140" y2="84.5"/>
              <rect class="handle" x="74" y="89" width="12" height="2.5" rx="1"/>
            </g>
            <g class="curve">
              <rect x="20" y="50" width="120" height="4"/>
              <line x1="20" y1="51.2" x2="140" y2="51.2"/>
              <line x1="20" y1="52.8" x2="140" y2="52.8"/>
            </g>
          </g>
          <rect class="frame" x="20" y="50" width="120" height="46"/>
          <line class="ground" x1="0" y1="96" x2="160" y2="96"/>
          <text class="mark" x="80" y="82">?</text>
        </svg>
        <div>
          <div id="status-label" class="status-label">Laster …</div>
          <div id="status-time" class="muted" hidden></div>
        </div>
      </div>

      <p id="notice" class="notice" hidden></p>

      <button id="action-btn" class="primary big" type="button" disabled>…</button>

      <p id="message" class="error" hidden></p>

      <details id="more">
        <summary>Detaljer</summary>
        <dl class="details">
          <dt>Siste melding</dt><dd id="last-seen">–</dd>
          <dt>Sensorer</dt><dd id="sensors">–</dd>
          <dt>Signal</dt><dd id="signal">–</dd>
          <dt>Relépulser i dag</dt><dd id="budget">–</dd>
          <dt>Downlinks i dag (inkl. ACK)</dt><dd id="downlinks">–</dd>
        </dl>

        <h2>Historikk</h2>
        <ol id="history" class="history"></ol>
      </details>
    </section>

    <dialog id="confirm">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p class="warning">⚠ Se etter at porten har fri bane. Det er ingen fotocelle som stopper den.</p>
        <p id="confirm-extra" hidden></p>
        <button id="confirm-ok" value="ok" class="primary big"></button>
        <button value="cancel" class="link cancel" formnovalidate>Avbryt</button>
      </form>
    </dialog>
  </main>

  <script src="config.js?v=2026-11-05"></script>
  <script src="app.js?v=2026-11-05"></script>
</body>
</html>
