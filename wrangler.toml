name = "garasjeport"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Workers Logs: console-utskrifter fra Workeren lagres hos Cloudflare og kan søkes i dashbordet.
[observability]
enabled = true

# Status, historikk og tellere ligger i Durable Object-en GarageState (alltid oppdatert).
[[durable_objects.bindings]]
name = "GARAGE_DO"
class_name = "GarageState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GarageState"]

# Gammel lagring. Brukes bare én gang, til å kopiere eksisterende data inn i GarageState.
[[kv_namespaces]]
binding = "GARAGE"
id = "ea5d418f336746209e65482f5ddbcf46"

[vars]
# GitHub Pages-adressen din (uten sti og uten / til slutt). Flere kan skilles med komma.
ALLOWED_ORIGIN = "https://sebastesnorvegicus.github.io"

TTN_BASE_URL = "https://eu1.cloud.thethings.network"
TTN_APP_ID = "garasjeport-hellargata"
TTN_DEVICE_ID = "garasjeport-node"
TTN_WEBHOOK_ID = "cf-worker"

# Hvilken inngang er «port lukket»-bryteren? DI1 eller DI2. Den andre blir «port åpen».
CLOSED_SENSOR = "DI2"

# Relépuls på RO1: 05 01 10 03 E8 = 1 s.  0,5 s: BQEQAfQ=   2 s: BQEQB9A=
PULSE_PAYLOAD = "BQEQA+g="

STALE_MINUTES = "30"
# Maks relépulser per døgn (norsk tid). Bekreftelser (ACK) fra TTN telles ikke her.
PULSE_DAILY_LIMIT = "20"
PULSE_MIN_INTERVAL_SECONDS = "15"

# --- Varsler via ntfy (slås på når secret NTFY_TOPIC er satt) ---
# Adressen til denne Workeren og til appen. Brukes i knappene i varselet.
WORKER_URL = "https://garasjeport.hellargata.workers.dev"
APP_URL = "https://sebastesnorvegicus.github.io/garasjeport/"
# Første varsel når porten har stått åpen så mange minutter
ALERT_OPEN_MINUTES = "15"
# Én påminnelse så mange minutter etter første varsel (hvis ikke «Jeg er i garasjen»)
ALERT_REMINDER_MINUTES = "60"
# Siste sjekk om kvelden (norsk tid), også når varsler er pauset. Tom streng = av.
ALERT_EVENING = "22:00"
# Varsel hvis noden har vært stille så lenge
ALERT_STALE_MINUTES = "60"

# Hemmeligheter settes med «npx wrangler secret put <NAVN>», aldri her:
#   TTN_API_KEY, WEBHOOK_SECRET, APP_TOKEN
#   NTFY_TOPIC (langt tilfeldig emnenavn), ALERT_ACTION_KEY (nøkkel for pauseknappen i varselet)
